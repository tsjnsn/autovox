# pnpm v11 reads project settings from this file (not package.json#pnpm).
allowBuilds:
  browser-tabs-lock: false
  bufferutil: false
  core-js: false
  esbuild: true
  utf-8-validate: false
minimumReleaseAgeExclude:
  - '@clerk/chrome-extension@3.1.81'
  - '@clerk/react@6.15.1'
  - '@clerk/ui@1.32.2'
