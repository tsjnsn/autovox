name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Typecheck
        run: pnpm compile

      - name: Zip Chrome extension
        run: pnpm zip

      - name: Assert package version matches tag
        run: |
          TAG="${GITHUB_REF_NAME}"
          EXPECTED="${TAG#v}"
          ACTUAL="$(node -p "require('./package.json').version")"
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "package.json version ($ACTUAL) does not match tag ($TAG)"
            exit 1
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: .output/*-chrome.zip
          generate_release_notes: true

      - name: Submit to Chrome Web Store
        env:
          # Public listing ID: https://chromewebstore.google.com/detail/autovox/aodlbiejdiibbpemagfngbdhaappejda
          CHROME_EXTENSION_ID: aodlbiejdiibbpemagfngbdhaappejda
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
        run: pnpm wxt submit --chrome-zip .output/*-chrome.zip
