name: Release Chrome

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Validate store credentials without uploading
        type: boolean
        default: true
      skip_review:
        description: Upload as draft without submitting for review
        type: boolean
        default: false

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install

      - name: Zip Chrome extension
        run: pnpm zip

      - name: Submit to Chrome Web Store
        env:
          # Public listing ID: https://chromewebstore.google.com/detail/autovox/aodlbiejdiibbpemagfngbdhaappejda
          CHROME_EXTENSION_ID: aodlbiejdiibbpemagfngbdhaappejda
          CHROME_CLIENT_ID: ${{ secrets.CHROME_CLIENT_ID }}
          CHROME_CLIENT_SECRET: ${{ secrets.CHROME_CLIENT_SECRET }}
          CHROME_REFRESH_TOKEN: ${{ secrets.CHROME_REFRESH_TOKEN }}
          CHROME_SKIP_SUBMIT_REVIEW: ${{ inputs.skip_review }}
        run: |
          ARGS=(--chrome-zip .output/*-chrome.zip)
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          pnpm wxt submit "${ARGS[@]}"
